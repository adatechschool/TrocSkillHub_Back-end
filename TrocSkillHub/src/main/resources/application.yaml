spring:
  application:
    name: TrocSkillHub
  
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  
  mail:
    host: ${MAIL_HOST:smtp.mail.ovh.net}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

    
logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}
  password-reset:
    code-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:15}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
  mail:
    from: ${MAIL_FROM:noreply@trocskillhub.com}
  editique:
    template: classpath:templates/editique/profile-cv.html
    pdf-filename-prefix: profil
