name: Backup Supabase DB

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  backup:
    name: Dump database
    runs-on: ubuntu-latest

    steps:
      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm postgres:17 \
            pg_dump "$SUPABASE_DB_URL" -F c > backup_$(date +%Y%m%d_%H%M%S).dump

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: '*.dump'
          retention-days: 30
